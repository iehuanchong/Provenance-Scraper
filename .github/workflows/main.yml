name: Daily Figure origination scrape

# GitHub Actions cron only runs on fixed UTC times -- it has no concept
# of "midnight Eastern" directly, and ET shifts between EST (UTC-5) and
# EDT (UTC-4) twice a year. So we schedule both possible UTC times and
# use a guard job to only actually run the one that currently matches
# true midnight in America/New_York. This self-corrects across DST
# changes with no manual edits needed.
on:
  schedule:
    - cron: "0 5 * * *"   # 00:00 EST (UTC-5) -- roughly early Nov to mid Mar
    - cron: "0 4 * * *"   # 00:00 EDT (UTC-4) -- roughly mid Mar to early Nov
  workflow_dispatch: {}    # manual runs from the Actions tab always run, regardless of time

permissions:
  contents: write

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          HOUR_ET=$(TZ="America/New_York" date +%H)
          echo "Current hour in America/New_York: $HOUR_ET"
          if [ "$HOUR_ET" = "00" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scrape
        run: python run_daily.py

      - name: Commit updated data + exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/originations.db exports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily scrape: $(TZ='America/New_York' date +'%Y-%m-%d') ET"
            git push
          fi
